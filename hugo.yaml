# Hugo configuration file
title: Apuntes UNED
description: "Apuntes Derecho UNED"

languageCode: es-ES
defaultContentLanguage: es
defaultContentLanguageInSubdir: false

languages:
  es:
    languageName: Español
    weight: 1

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Apuntes
      pageRef: /apuntes
      weight: 1
    - name: Información
      pageRef: /about
      weight: 2
    - name: Buscar
      weight: 3
      params:
        type: search

params:
  description: "Apuntes Derecho UNED"

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false

  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content, summary
      index: content
      # forward, reverse, full - https://github.com/nextapps-de/flexsearch#tokenizer
      tokenize: forward
